<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Gallery | CodeAlpha</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>Image Gallery</h1>
    <p>Browse, filter and view photos in full screen</p>
  </header>

  <nav class="filters" id="filters" aria-label="Image categories"></nav>

  <main>
    <section class="gallery" id="gallery" aria-live="polite"></section>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
    <button class="lb-btn lb-close" id="lbClose" aria-label="Close">&times;</button>
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous image">&#10094;</button>
    <figure class="lb-figure">
      <img id="lbImg" src="" alt="" />
      <figcaption>
        <span id="lbCaption"></span>
        <span id="lbCounter" class="lb-counter"></span>
      </figcaption>
    </figure>
    <button class="lb-btn lb-next" id="lbNext" aria-label="Next image">&#10095;</button>
  </div>

  <footer class="footer">Built for CodeAlpha Frontend Development Internship &mdash; Task 1</footer>

  <script src="script.js"></script>
</body>
</html>
